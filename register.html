<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Member | Zero Syndicate</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Library Resmi Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-nav">
      <a href="index.html" class="btn-back">&larr; Kembali ke Beranda</a>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">&#9733; Pendaftaran Member</span>
        <h2>Gabung Zero Syndicate</h2>
        <p>Daftarkan akun Anda. Setelah mendaftar, akun akan diverifikasi (di-ACC) oleh Admin sebelum akses materi dibuka.</p>
      </div>

      <!-- Kotak Notifikasi -->
      <div id="alertBox" class="alert-box" style="display: none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="nama_lengkap">Nama Lengkap</label>
          <input type="text" id="nama_lengkap" class="form-input" placeholder="Masukkan nama Anda" required />
        </div>

        <div class="form-group">
          <label for="email_member">Alamat Email Aktif</label>
          <input type="email" id="email_member" class="form-input" placeholder="nama@email.com" required />
        </div>

        <div class="form-group">
          <label for="password_member">Password Akun</label>
          <input type="password" id="password_member" class="form-input" placeholder="Minimal 6 karakter" required minlength="6" />
        </div>

        <div class="form-group">
          <label for="kontak_wa">Nomor WhatsApp / Telegram</label>
          <input type="text" id="kontak_wa" class="form-input" placeholder="Contoh: 0882010445069" required />
        </div>

        <div class="form-group">
          <label for="trading_exp">Tingkat Pengalaman Trading</label>
          <select id="trading_exp" class="form-input" style="background:#090a0e; color:#fff;" required>
            <option value="Pemula">Pemula (Baru Mengenal Trading)</option>
            <option value="Menengah">Menengah (1-2 Tahun)</option>
            <option value="Advanced">Advanced (Fokus SMC & Gold)</option>
          </select>
        </div>

        <button type="submit" id="submitBtn" class="auth-btn-submit">Daftar Sekarang &rarr;</button>
      </form>

      <div class="broker-box">
        <p>Sudah punya akun broker partner resmi?</p>
        <a href="https://ma.valetax-indonesia.com/p/1682343" target="_blank" rel="noopener" class="btn-outline" style="display:block; padding: 10px; font-size: 0.85rem;">Buka Akun Valetax &nearr;</a>
      </div>

      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hcivtyolebblrqqgpuoj.supabase.co';
    const SUPABASE_ANON_KEY = 'Sb_publishable_VMXDKPEBhmfcaTo2P5-xoA_7HMoBKEv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Mendaftarkan akun...';
      alertBox.style.display = 'none';

      const email = document.getElementById('email_member').value.trim();
      const password = document.getElementById('password_member').value;
      const fullName = document.getElementById('nama_lengkap').value.trim();
      const contact = document.getElementById('kontak_wa').value.trim();
      const exp = document.getElementById('trading_exp').value;

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName,
              contact: contact,
              trading_exp: exp
            }
          }
        });

        if (error) throw error;

        alertBox.className = 'alert-box alert-success';
        alertBox.innerHTML = `<strong>Registrasi Berhasil!</strong> Akun Anda berstatus <em>PENDING</em>. Silakan hubungi Admin di WhatsApp untuk aktivasi (ACC) akun Anda.`;
        alertBox.style.display = 'block';
        form.reset();

      } catch (err) {
        alertBox.className = 'alert-box alert-error';
        alertBox.innerHTML = `<strong>Gagal:</strong> ${err.message || 'Terjadi gangguan koneksi.'}`;
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Daftar Sekarang →';
      }
    });
  </script>
</body>
</html>
